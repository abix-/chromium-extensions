<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>upit settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #222;
      max-width: 600px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 { font-size: 18px; }
    label { display: block; margin-bottom: 6px; color: #444; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      padding: 6px 14px;
      font-size: 12px;
      border: 1px solid #2b7cff;
      background: #2b7cff;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .message { margin-left: 10px; color: #666; }
  </style>
</head>
<body>
  <div id="upit-root"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
