<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>upit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #222;
      margin: 0;
      padding: 10px;
    }
    button {
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { cursor: default; opacity: 0.5; }
    .toolbar { display: flex; gap: 8px; }
    .toolbar .submit { background: #2b7cff; color: #fff; border-color: #2b7cff; }
    .message { color: #666; }
    .posts { list-style: none; padding: 0; margin: 0; }
    .posts li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .title { font-weight: 600; color: #222; text-decoration: none; }
    .title:hover { text-decoration: underline; }
    .meta { color: #888; font-size: 11px; margin: 2px 0; }
    .snippet { color: #555; font-size: 12px; }
    .votes { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .votes button.on { background: #222; color: #fff; border-color: #222; }
    .status { color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <div id="upit-root"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
